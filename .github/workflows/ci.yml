name: CI

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/

      - name: Install DVC
        run: pip install dvc dvc-s3

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify storage --local access_key_id ${{ secrets.DAGSHUB_TOKEN }}
          dvc remote modify storage --local secret_access_key ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull data
        run: dvc pull

      - name: Reproduce pipeline (smoke test)
        run: dvc repro
